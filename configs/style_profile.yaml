# これは一般的な日本語の科学解説動画を想定した「当面の目安」で、VAIENCEの実測値ではない。
# 参考動画を解析したら、次のコマンドでこのファイルを実測値に置き換えること:
#   python scripts/vlab.py aggregate analysis/動画1 analysis/動画2 analysis/動画3 -o configs/style_profile.yaml
# 数値だけ(映像・音声・台詞を含まない)なのでコミットしてよい。
