# See-through出力レイヤー → Live2D Cubism標準構造 のマッピング定義
#
# - rules: 上から順に評価し、最初にマッチしたルールを採用する。
#   patterns は正規表現(大文字小文字無視)。元PSDの「フォルダパス+レイヤー名」と、
#   区切り文字(_-)をスペース化した表記の両方に対して検索する。
#   sided: true のルールは区切り付きのL/R(左/右)表記を検出して "_L"/"_R" を付与する。
# - group_order: 正規化後のフォルダ重ね順(先頭が最前面)。
#   Cubismのテンプレート機能はレイヤー名の一致で対応付けるため、
#   ここの構造を全モデルで固定することが量産の要になる。
#
# このパターン集はSee-through本体のソース調査で確認した実タグ体系
# (ComfyUI-See-through nodes.py より) に合わせて較正済み:
#   V3 body: front hair / back hair / head / neck / neckwear / topwear / handwear
#            / bottomwear / legwear / footwear / tail / wings / objects
#   V3 head: headwear / face / irides / eyebrow / eyewhite / eyelash / eyewear
#            / ears / earwear / nose / mouth
#   左右分割(接尾辞直付き): eyer/eyel, earr/earl, browr/browl, handwear-r/-l,
#   前後分割: hairf(前髪)/hairb(後髪)
# モデルのバージョンアップで名前が変わったら inspect で確認してここに追記する。

canvas:
  recommended_min: 1280   # see-through推奨処理解像度

group_order:
  - "00_前髪"
  - "01_顔"
  - "02_耳"
  - "03_横髪"
  - "04_体"
  - "05_後髪"
  - "06_背景"

rules:
  # --- 頭部・髪 ---
  - name: "帽子"
    group: "00_前髪"
    patterns: ["headwear", "\\bhat\\b", "帽子"]
  - name: "前髪"
    group: "00_前髪"
    patterns: ["front[_ ]?hair", "\\bhairf\\b", "bangs?", "fringe", "前髪"]
  - name: "アホ毛"
    group: "00_前髪"
    patterns: ["ahoge", "hair[_ ]?antenna", "アホ毛"]
  - name: "後髪"
    group: "05_後髪"
    patterns: ["back[_ ]?hair", "\\bhairb\\b", "後髪", "後ろ髪"]
  - name: "横髪"
    group: "03_横髪"
    sided: true
    patterns: ["side[_ ]?hair", "sidelocks?", "横髪"]
  # 前後の指定がない hair はいったん前髪扱いにして inspect で確認する
  - name: "髪"
    group: "00_前髪"
    patterns: ["\\bhair\\b", "髪"]

  # --- 顔まわりの装着物 (「wear」を含むため衣服より先に評価する) ---
  - name: "眼鏡"
    group: "01_顔"
    patterns: ["eyewear", "glasses", "眼鏡", "メガネ"]
  - name: "耳飾り"
    group: "02_耳"
    patterns: ["earwear", "earring", "イヤリング", "耳飾り"]
  - name: "首飾り"
    group: "04_体"
    patterns: ["neckwear", "necklace", "choker", "チョーカー", "首飾り"]
  - name: "手袋"
    group: "04_体"
    sided: true
    patterns: ["handwear", "gloves?", "手袋"]

  # --- 顔パーツ (輪郭より先に評価する) ---
  # 左右分割タグは接尾辞が直付き(browr等)のため明示ルールで対応する
  - name: "眉_R"
    group: "01_顔"
    patterns: ["\\bbrowr\\b", "eyebrow[_ ]?r\\b"]
  - name: "眉_L"
    group: "01_顔"
    patterns: ["\\bbrowl\\b", "eyebrow[_ ]?l\\b"]
  - name: "眉"
    group: "01_顔"
    sided: true
    patterns: ["eyebrows?", "\\bbrows?\\b", "眉"]
  - name: "まつげ"
    group: "01_顔"
    sided: true
    patterns: ["eyelash", "lash", "まつげ", "睫毛"]
  - name: "白目"
    group: "01_顔"
    sided: true
    patterns: ["eyewhite", "eye[_ ]?white", "sclera", "white[_ ]?of[_ ]?eye", "白目"]
  - name: "瞳"
    group: "01_顔"
    sided: true
    patterns: ["irides", "iris", "pupil", "eyeball", "瞳", "黒目"]
  - name: "目_R"
    group: "01_顔"
    patterns: ["\\beyer\\b"]
  - name: "目_L"
    group: "01_顔"
    patterns: ["\\beyel\\b"]
  - name: "目"
    group: "01_顔"
    sided: true
    patterns: ["\\beyes?\\b", "\\b目\\b"]
  - name: "鼻"
    group: "01_顔"
    patterns: ["nose", "鼻"]
  - name: "口"
    group: "01_顔"
    patterns: ["mouth", "lips?", "口"]
  - name: "頬"
    group: "01_顔"
    patterns: ["cheek", "blush", "頬", "ほほ"]
  - name: "顔"
    group: "01_顔"
    patterns: ["\\bface\\b", "\\bskin\\b", "顔", "輪郭"]
  # head(頭部ベース)はface(顔面)と別タグなので名前を分けて衝突を避ける
  - name: "頭"
    group: "01_顔"
    patterns: ["\\bhead\\b", "\\b頭\\b"]

  # --- 耳 ---
  - name: "耳_R"
    group: "02_耳"
    patterns: ["\\bearr\\b"]
  - name: "耳_L"
    group: "02_耳"
    patterns: ["\\bearl\\b"]
  - name: "耳"
    group: "02_耳"
    sided: true
    patterns: ["\\bears?\\b", "耳"]

  # --- 体まわり ---
  - name: "首"
    group: "04_体"
    patterns: ["\\bneck\\b", "首"]
  - name: "手"
    group: "04_体"
    sided: true
    patterns: ["hands?", "finger", "手(?!袋)"]
  - name: "腕"
    group: "04_体"
    sided: true
    patterns: ["\\barms?\\b", "sleeve", "腕", "袖"]
  - name: "服_上"
    group: "04_体"
    patterns: ["topwear", "shirt", "jacket", "hoodie", "sailor", "uniform",
               "セーラー", "制服", "上着"]
  - name: "服_下"
    group: "04_体"
    patterns: ["bottomwear", "skirt", "pants", "shorts", "スカート", "ズボン"]
  - name: "靴下"
    group: "04_体"
    sided: true
    patterns: ["legwear", "socks?", "stockings?", "tights", "靴下", "タイツ"]
  - name: "靴"
    group: "04_体"
    sided: true
    patterns: ["footwear", "shoes?", "boots?", "靴", "ブーツ"]
  - name: "脚"
    group: "04_体"
    sided: true
    patterns: ["\\blegs?\\b", "\\bfoot\\b", "\\bfeet\\b", "脚", "足"]
  - name: "小物"
    group: "04_体"
    patterns: ["objects?", "\\bprops?\\b", "小物"]
  - name: "アクセサリ"
    group: "04_体"
    patterns: ["accessor", "ribbon", "\\bbow\\b", "hairpin", "リボン", "アクセ"]
  - name: "服"
    group: "04_体"
    patterns: ["cloth", "dress", "\\bwear\\b", "服", "衣装"]
  - name: "体"
    group: "04_体"
    patterns: ["body", "torso", "chest", "体", "胴"]

  # --- 背面要素 (後髪グループにまとめて体より奥に置く) ---
  - name: "尻尾"
    group: "05_後髪"
    patterns: ["tail", "尻尾", "しっぽ"]
  - name: "翼"
    group: "05_後髪"
    patterns: ["wings?", "翼", "羽"]

  # --- 背景 ---
  - name: "背景"
    group: "06_背景"
    patterns: ["background", "\\bbg\\b", "背景"]
