# 自動編集 (ジェットカット + テロップ + BGM) の設定
# 使い方は docs/06_auto_edit.md 参照。数値を変えたら render だけやり直せば反映される。

# テロップの様式。ファイル末尾の presets: で中身を上書きしている
#   talk     … 年収チャンネル系 (対談向け。話者ごとの座布団・2〜3フレームの詰めカット)
#   business … マコなり社長系 (座布団なし・白文字に紺の太い縁取り・キーワード色替え)
#   news     … ニュース番組風 (画面下の帯 + 金のライン)
preset: talk

jetcut:
  silence_threshold_db: -35   # これより小さい音を「無音」とみなす (声が切れるなら -40 へ)
  min_silence: 0.4            # この長さ(秒)以上続く無音だけカットする
  keep_padding: 0.08          # 発話区間の前後に残す余白(秒)。詰まりすぎるなら増やす
  keep_padding_frames: null   # 余白をフレーム数で指定 (指定するとkeep_paddingより優先)
  join_gap: 0.15              # この間隔(秒)以下で隣接する発話区間はつなげる
  min_keep: 0.3               # これより短い発話区間はノイズとみなして捨てる

telop:
  model: small                # faster-whisperモデル (tiny/base/small/medium/large-v3)
  language: ja
  device: auto                # auto/cpu/cuda。CUDAで失敗したら自動でCPUに切り替わる
  compute_type: int8          # VRAM 4GB・CPUでも動く省メモリ設定
  # 放送の字幕基準: 1行13〜15.5文字・最大2行・2秒以上6.5秒以下・毎秒約4文字
  max_chars_per_line: 15
  max_lines: 2
  min_duration: 1.2           # テロップの最低表示時間(秒)
  max_duration: 6.5           # 1枚あたりの最大表示時間(秒)
  reading_speed: 4.0          # 1秒あたりの読める文字数。表示時間の自動調整に使う
  strip_trailing_period: true # 文末の「。」を消す (放送字幕の慣習)

style:                        # ニュース番組風テロップの見た目 (1080p基準・解像度に自動追従)
  # auto = PCにある放送向けフォントを自動選択 (下の候補を上から順に探す)
  font: auto
  font_candidates:
    - Noto Sans JP Black      # 最推奨。無料DL (docs/06参照)。太ゴB101系の代替
    - Noto Sans JP            # 同上 (fetch_fonts.py で入れたファイルはこの名前)
    - Noto Sans CJK JP Black
    - BIZ UDPGothic           # Windows 10/11 標準。DL不要
    - Meiryo                  # Windows 標準。太字が力強い
    - Yu Gothic UI
    - Yu Gothic
  bold: true
  # 以下 *_em は「文字サイズに対する倍率」。画面解像度が変わっても比率が保たれる
  font_size_ratio: 0.062      # 1行のときの文字サイズ / 画面高さ
  font_size_ratio_wrapped: ~  # 2行になったときの文字サイズ (~ なら1行と同じ)
  line_height_em: 1.45        # 行間 (日本語は文字サイズの150%前後が下限)
  tracking_em: -0.02          # 字間。マイナスで詰める (文字詰めが"プロっぽさ"の決め手)
  text_color: "FFFFFF"        # 白文字が基本
  outline_color: "0A1428"     # 縁取りは暗色が基本
  outline_em: 0.05            # 縁取りの太さ (放送の目安は文字サイズの5〜10%)
  shadow_em: 0.05             # ドロップシャドウの距離 (0で影なし)
  shadow_opacity: 0.45        # 影の濃さ (濃すぎると安っぽくなる。目安5〜30%)
  blur: 0.0                   # 縁と影のぼかし量(px)。0でくっきり
  double_outline: false       # 二重縁取り (バラエティ寄り。ニュースはfalse推奨)
  double_outline_color: "FFFFFF"
  safe_margin_ratio: 0.05     # 左右のセーフマージン (画面端の詰まりを防ぐ)
  position_ratio: 0.88        # 座布団なしのときの文字の下端位置 / 画面高さ

emphasis:                     # キーワードだけ色を変える (ビジネス系YouTubeの定番)
  enabled: true
  color: "FFE14D"             # 強調色 (黄色)
  outline_color: ""           # 強調部分の縁取り色。空なら通常と同じ
  auto_numbers: true          # 数字+単位 (3割/1000万円/50%) を自動で強調
  keywords: []                # 常に強調したい語。例: ["圧倒的", "結論"]
  # 文字起こしSRTを手直しするとき *この書き方* で囲んだ部分も強調される

scenes:                       # 場面ごとにフォント・大きさ・色を切り替える
  # SRTの行頭に mark の記号を付けると、その行だけこの見た目になる。
  # font_candidates が空なら通常フォントのまま。上から順に判定される。
  punch:                      # ツッコミ・ボケ
    mark: "!"
    scale: 1.22
    font_candidates: []
    color: ""
    outline_color: ""
  point:                      # 要点・結論 (ここぞという一言)
    mark: "#"
    scale: 1.12
    font_candidates: []
    color: ""
    outline_color: ""
  question:                   # 質問 (文末が「？」の行は自動でこれになる)
    mark: "?"
    auto: question
    scale: 1.0
    font_candidates: []
    color: ""
    outline_color: ""

speakers: {}                  # 対談向け: 話者ごとの座布団色。SRTに「名前: 発言」と書く
  # 例)
  #   株本: "C9A227"
  #   ゲスト: "1F5F8B"

band:                         # テロップの下地 (座布団 / テロップベース)
  enabled: true
  color: "0B1A33"             # 紺。報道番組の定番色
  opacity: 0.85               # 0=透明 〜 1=不透明 (放送の目安は70〜85%)
  gradient: 0.18              # 上ほど透ける度合い (0でフラット)。上端でも70%は残す
  gradient_steps: 14          # グラデーションの段数
  full_bleed: true            # 画面下端まで帯を伸ばす (中途半端な浮きを防ぐ)
  bottom_margin_ratio: 0.0    # full_bleed=false のときの下端からの距離 / 画面高さ
  padding_em: 0.52            # 帯の内側の上下余白 (放送の目安は文字サイズの50〜70%)
  padding_x_em: 0.78          # 帯の内側の左右余白 (fit_width のときに効く)
  fit_content: true           # 帯の高さを行数に合わせる (1行のとき余白が空きすぎない)
  fit_width: false            # true=文字の幅に合わせた「座布団」 / false=全幅の帯
  corner_radius_em: 0.0       # 座布団の角丸 (文字サイズ比)
  accent_color: "E8B54D"      # 帯の上辺のアクセントライン (金色)
  accent_em: 0.075            # アクセントラインの太さ (文字サイズ比)

title:                        # 画面左上の番組名バー (ニュースの番組ロゴ枠風)
  text: ""                    # 空なら非表示。例: "AITuberニュース"
  font_size_ratio: 0.033
  text_color: "FFFFFF"
  bg_color: "B3261E"          # 赤帯
  bg_opacity: 0.92
  accent_color: "E8B54D"      # 左端の縦アクセントバー
  margin_ratio: 0.045         # 画面端からの距離 / 画面高さ (セーフゾーン確保)

bgm:
  file: ""                    # BGMファイルのパス。空なら無し (--bgm で毎回指定してもよい)
  volume_db: -18              # 声に対するBGM音量 (下げるほど静か)
  loop: true                  # 動画の長さに合わせてループ
  fade: 1.5                   # フェードイン/アウト(秒)
  ducking: true               # 声が鳴っている間BGMを自動で下げる (ニュース風)

encode:
  video_codec: auto           # auto=NVENC(GPU)優先で失敗したらlibx264 / libx264 / h264_nvenc
  crf: 18                     # libx264の画質 (小さいほど高画質・大容量)
  preset: veryfast
  audio_bitrate: 192k

# ------------------------------------------------------------------ プリセット
# 上の設定を様式ごとに上書きする。書いた項目だけが差し替わる。
# 根拠にした調査は docs/06_auto_edit.md 末尾を参照。
presets:

  # マコなり社長系。フォントは源ノ角ゴシック Heavy、縁取りは紺 #294069。
  # 座布団を使わず、太い縁取りと影だけで映像から浮かせる。
  business:
    jetcut:
      min_silence: 0.25       # 短い間も積極的に詰める
      keep_padding_frames: 2  # 発話の前後に残すのは2フレームだけ
      join_gap: 0.12
    telop:
      max_chars_per_line: 18  # スマホ視聴前提でテレビより1行を長く
      max_lines: 2
      min_duration: 0.8
    style:
      font_candidates:
        - Source Han Sans JP Heavy   # = 源ノ角ゴシック Heavy (Adobe Fonts名)
        - Noto Sans JP Black         # 同じ設計の無料版
        - Noto Sans JP               # fetch_fonts.py で入れたファイルはこの名前
        - Noto Sans CJK JP Black
        - BIZ UDPGothic
        - Meiryo
      font_size_ratio: 0.075  # ニュースより大きく
      outline_color: "294069" # 紺
      outline_em: 0.11        # 太い縁取り
      shadow_em: 0.06
      shadow_opacity: 0.5
      tracking_em: -0.03
      position_ratio: 0.88
    band:
      enabled: false          # 座布団なし
    emphasis:
      enabled: true
      color: "FFE14D"

  # 年収チャンネル系（対談・インタビュー）。制作元が公開している編集方針に合わせている:
  #   ・発声と発声の間は常に2〜3フレーム
  #   ・座布団のイメージカラーで誰の発言か分かるようにする
  #   ・ツッコミ/ボケは拡大しつつフォントを変える
  #   ・落ち着いた雰囲気を崩さない（過度なエフェクトを足さない）
  # ※フォント名・文字サイズ・カラーコードは公開されていないため、
  #   上の方針と対談動画の一般則から決めている（詳細は docs/06）
  talk:
    jetcut:
      # 発話の前後に1.5フレームずつ残す → つなぎ目の無音はちょうど3フレーム
      keep_padding_frames: 1.5
      min_silence: 0.15       # 短い間も対象にして詰める
      join_gap: 0.06          # 2フレーム以下の間は切らずにつなぐ
      min_keep: 0.25
    telop:
      max_chars_per_line: 16  # 全発言をテロップ化する前提で1行を短めに
      max_lines: 2
      min_duration: 0.7       # テンポが速いので短い表示も許す
      reading_speed: 5.0
    style:
      font_candidates:
        - Source Han Sans JP Heavy   # 源ノ角ゴシック Heavy
        - Noto Sans JP Black         # 同設計の無料版
        - Noto Sans JP               # fetch_fonts.py で入れたファイルはこの名前
        - Noto Sans CJK JP Black
        - BIZ UDPGothic
        - Meiryo
      # 1行のときは大きく見せ、2行になったら収まるサイズに切り替える
      font_size_ratio: 0.090
      font_size_ratio_wrapped: 0.070
      text_color: "FFFFFF"
      outline_color: "10161C" # 座布団なしで映像に直接乗るので縁は太めに
      outline_em: 0.095
      shadow_em: 0.05
      shadow_opacity: 0.45
      tracking_em: -0.02
    band:                     # 座布団なし。縁取りと影だけで映像から浮かせる
      enabled: false
      # 座布団を使いたくなったら enabled: true に戻す。話者ごとの色分けが効く
      color: "232B36"         # speakers: を設定すると話者ごとの色に置き換わる
      opacity: 0.9
      gradient: 0.0           # 単色（グラデーションは足さない）
      accent_em: 0.0          # アクセントラインなし
      full_bleed: false
      bottom_margin_ratio: 0.055
      fit_content: true
      fit_width: true
      corner_radius_em: 0.14
    emphasis:
      enabled: true
      color: "FFD34D"         # 年収・金額など数字を目立たせる
      auto_numbers: true
    scenes:                   # 場面ごとの切り替え (フォントは fetch_fonts.py で追加できる)
      punch:
        mark: "!"
        scale: 1.15
        font_candidates: [Yusei Magic, Rounded Mplus 1c ExtraBold]
      point:
        mark: "#"
        scale: 1.10
        font_candidates: [Dela Gothic One]
      question:
        mark: "?"
        auto: question
        scale: 1.0
        font_candidates: []
    speakers:                 # 名前は自分の動画に合わせて書き換える
      # 白文字を載せるので、座布団の色は暗め(明るいと文字が沈む)
      株本: "6B4E0F"          # 進行役: 深い金
      ゲスト: "12405F"        # ゲスト: 深い青

  # ニュース番組風 (このファイルの既定値そのまま)
  news: {}
